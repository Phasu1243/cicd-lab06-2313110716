name: CI/CD Assignment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-quick
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-quick
          TAG: ${{ github.sha }}
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Push Docker image to Docker Hub
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-quick
          TAG: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: SSH to VM - Pull and Run Docker image
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-quick
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: IMAGE,TAG
          script: |
            set -eu
            docker pull "$IMAGE:$TAG"
            if docker container inspect cicd-quick-web >/dev/null 2>&1; then
              docker rm -f cicd-quick-web
            fi
            docker run -d --name cicd-quick-web --restart unless-stopped -p 80:80 "$IMAGE:$TAG"
            for attempt in 1 2 3 4 5; do
              if curl -fsS --max-time 3 http://127.0.0.1/; then
                exit 0
              fi
              sleep 2
            done
            docker logs --tail 30 cicd-quick-web
            exit 1
